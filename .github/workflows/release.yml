name: release

# Push a tag matching VERSION to publish the x64 and ARM64 installers. Manual runs
# build the same two installers as artifacts only and preview the Release notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - shell: powershell
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match VERSION $version"
          }
          & packaging/release_notes.ps1 release-notes.md | Out-Null
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, [IO.File]::ReadAllText('release-notes.md'))

  installers:
    needs: notes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: choco install nsis -y --no-progress
      - shell: powershell
        run: |
          packaging/build.ps1 -FrontendOnly
          packaging/build.ps1 -SkipFrontend -Arch x64
          packaging/build.ps1 -SkipFrontend -Arch arm64
          $version = (Get-Content -Raw VERSION).Trim()
          $expected = @('x64', 'arm64') | ForEach-Object { "Pageway-Setup-$version-windows-$_.exe" }
          $actual = @(Get-ChildItem dist -Filter '*.exe' | ForEach-Object Name)
          if (Compare-Object $expected $actual) {
            Write-Error "Unexpected installers: $($actual -join ', ')"
          }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "VERSION=$version`n")
      # archive: false uploads one file per step and uses the file name as the artifact name.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/Pageway-Setup-${{ env.VERSION }}-windows-x64.exe
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: dist/Pageway-Setup-${{ env.VERSION }}-windows-arm64.exe
          archive: false

  release:
    needs: installers
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: Pageway-Setup-*
          path: dist
          merge-multiple: true
      - run: |
          ls -l dist
          test "$(find dist -maxdepth 1 -type f -name 'Pageway-Setup-*.exe' | wc -l)" -eq 2
          pwsh packaging/release_notes.ps1 release-notes.md > /dev/null
      - run: gh release create "$GITHUB_REF_NAME" dist/Pageway-Setup-*.exe --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
