<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pageway RDP</title>
  <link rel="icon" type="image/svg+xml" href="/pageway-icon.svg" />
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:clamp(12px,5vh,48px) 16px 24px;background:#f3f3f4;color:#202022;font:14px/1.6 system-ui,'Segoe UI','Microsoft YaHei',sans-serif}body::before{content:'';position:fixed;inset:0;background:rgba(0,0,0,.28);pointer-events:none}.dialog{position:relative;width:min(460px,100%);margin:0 auto;background:#fff;border:1px solid #d9d9de;border-radius:12px;box-shadow:0 16px 48px rgba(20,20,25,.2);overflow:hidden}.titlebar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid #d9d9de;color:#6d6d75;font-size:12px}.titlebar svg{width:16px;height:16px}.body{padding:18px 20px 16px}.head{display:flex;gap:12px;align-items:flex-start}.head>svg{width:32px;height:32px;flex:0 0 auto;color:#b97b18;stroke-width:1.6}h1{font-size:16px;line-height:1.4;margin:2px 0 6px}p{margin:0;color:#6d6d75;font-size:12px}.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0 0;padding:10px 12px;border:1px solid #d9d9de;border-radius:8px;background:#fafafa;font-size:13px}.facts dt{color:#6d6d75}.facts dd{margin:0;word-break:break-all}details{margin-top:10px;color:#6d6d75;font-size:12px}summary{cursor:pointer}.certificate{margin-top:8px;padding:10px 12px;border:1px dashed #d9d9de;border-radius:8px;line-height:1.7}.certificate code{display:block;color:#202022;font:11px/1.6 ui-monospace,Consolas,monospace;word-break:break-all}.certificate a{color:inherit}.hint,.steps{margin:12px 0 0}.limited{margin-top:12px;text-align:center}.limited a{color:inherit}.steps{padding:10px 12px 10px 30px;border:1px solid #d9d9de;border-radius:8px;background:#fafafa;color:#6d6d75;font-size:12px;line-height:1.8}.actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:16px}.button{min-width:86px;padding:8px 14px;border:1px solid #202022;border-radius:8px;background:#202022;color:#fff;font:inherit;font-size:13px;font-weight:600;text-align:center;text-decoration:none;cursor:pointer}.button.secondary{border-color:#d9d9de;background:#fff;color:#202022;font-weight:400}.wait{display:flex;align-items:center;gap:8px;margin-top:14px;color:#6d6d75;font-size:12px}.spinner{width:12px;height:12px;border:2px solid #d9d9de;border-top-color:#202022;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}svg{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.5}[hidden]{display:none!important}@media(max-width:480px){body{padding:8px}.body{padding:16px}.facts{font-size:12px}}@media(prefers-color-scheme:dark){body{background:#242426;color:#f2f2f3}.dialog{background:#2f2f33;border-color:#45454c;box-shadow:0 16px 48px rgba(0,0,0,.5)}.titlebar{border-color:#45454c;color:#aaaab2}.head>svg{color:#f5b942}p,details,.facts dt,.steps,.wait{color:#aaaab2}.facts,.steps{background:#1b1b1d;border-color:#45454c}.certificate{border-color:#45454c}.certificate code{color:#f2f2f3}.button{border-color:#f2f2f3;background:#f2f2f3;color:#161617}.button.secondary{border-color:#45454c;background:#2f2f33;color:#f2f2f3}.spinner{border-color:#45454c;border-top-color:#f2f2f3}}
  </style>
</head>
<body>
<main class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
  <div class="titlebar">
    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5" /><path d="M5.5 14h5M8 11.5V14" /></svg>
    <span>Pageway RDP</span>
  </div>
  <section id="checking" class="body">
    <div class="wait"><span class="spinner"></span><span data-zh="正在检查证书是否已受信任…" data-en="Checking whether the certificate is trusted…">正在检查证书是否已受信任…</span></div>
  </section>
  <section id="identity" class="body" hidden>
    <div class="head">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4 29 27H3z" /><path d="M16 13v6" /><path d="M16 23h.01" stroke-width="2.4" /></svg>
      <div>
        <h1 id="dialog-title" data-zh="无法验证这台电脑的身份。是否仍要连接？" data-en="The identity of this PC cannot be verified. Do you want to connect anyway?">无法验证这台电脑的身份。是否仍要连接？</h1>
        <p data-zh="这台电脑的证书由它自己签发，浏览器还不认识。请确认下面是你要连接的电脑。" data-en="This PC issued its own certificate, which your browser does not recognize yet. Confirm that this is the PC you want to connect to.">这台电脑的证书由它自己签发，浏览器还不认识。请确认下面是你要连接的电脑。</p>
      </div>
    </div>
    <dl class="facts">
      <dt data-zh="电脑名称" data-en="PC name">电脑名称</dt><dd id="host"></dd>
      <dt data-zh="地址" data-en="Address">地址</dt><dd id="address"></dd>
    </dl>
    <details>
      <summary data-zh="查看证书" data-en="View certificate">查看证书</summary>
      <div class="certificate">
        <span data-zh="颁发者：Pageway RDP 本机根证书（仅可用于本机名和私网地址）" data-en="Issuer: Pageway RDP local root CA (restricted to this PC's name and private network addresses)">颁发者：Pageway RDP 本机根证书（仅可用于本机名和私网地址）</span><br />
        <span data-zh="SHA-256 指纹：" data-en="SHA-256 fingerprint:">SHA-256 指纹：</span>
        <code id="fingerprint">—</code>
        <a href="/pageway/ca.cer" data-zh="下载证书文件" data-en="Download certificate file">下载证书文件</a>
      </div>
    </details>
    <div class="actions">
      <button id="trust" class="button" type="button" data-zh="永久信任并连接" data-en="Trust permanently and connect">永久信任并连接</button>
      <button id="once" class="button secondary" type="button" data-zh="仅本次继续" data-en="Continue this time only">仅本次继续</button>
    </div>
    <p class="hint" data-zh="永久信任只需按提示操作一次。“仅本次继续”还需在浏览器警告页选择“高级 → 继续前往”，Chrome 和 Edge 约 7 天后会再次询问。" data-en="Permanent trust requires following the prompts only once. “Continue this time only” also requires Advanced → Proceed in the browser warning; Chrome and Edge will ask again after about 7 days.">永久信任只需按提示操作一次。“仅本次继续”还需在浏览器警告页选择“高级 → 继续前往”，Chrome 和 Edge 约 7 天后会再次询问。</p>
    <p class="limited"><a href="/?limited=1" data-zh="不信任证书，以受限模式连接" data-en="Connect in limited mode without trusting the certificate">不信任证书，以受限模式连接</a></p>
  </section>
  <section id="waiting" class="body" hidden>
    <div class="head">
      <svg viewBox="0 0 32 32" aria-hidden="true" style="color:currentColor"><path d="M16 3 27 7v8c0 7-5 12-11 14C10 27 5 22 5 15V7z" /><path d="m11 16 3.5 3.5L21 13" /></svg>
      <div>
        <h1 data-zh="正在等待信任完成" data-en="Waiting for trust to complete">正在等待信任完成</h1>
        <p id="waiting-text"></p>
      </div>
    </div>
    <ol id="waiting-steps" class="steps"></ol>
    <div class="wait"><span class="spinner"></span><span id="waiting-status" data-zh="正在检查，完成后会自动进入，无需刷新。" data-en="Checking. You will be connected automatically when complete; no refresh is needed.">正在检查，完成后会自动进入，无需刷新。</span></div>
    <div class="actions"><button class="button secondary back" type="button" data-zh="返回" data-en="Back">返回</button></div>
  </section>
</main>
<script>
const zh=!navigator.language.toLowerCase().startsWith('en');
for(const e of document.querySelectorAll('[data-zh]'))e.textContent=zh?e.dataset.zh:e.dataset.en;
document.documentElement.lang=zh?'zh-CN':'en';
const secureUrl=new URL(location.href);secureUrl.protocol='https:';secureUrl.search='';
const views=['checking','identity','waiting'];
let pollTimer;
let polling=false;
function show(id){for(const view of views)document.getElementById(view).hidden=view!==id}
async function check(){try{await fetch(new URL('/pageway/ping',secureUrl),{cache:'no-store',mode:'no-cors'});location.replace(secureUrl);return true}catch{}return false}
const ua=navigator.userAgent;const firefox=Number(/Firefox\/(\d+)/.exec(ua)?.[1]||0);
const os=/iPhone|iPad/.test(ua)?'ios':/Android/.test(ua)?'android':/Mac OS X/.test(ua)?'mac':/Windows/.test(ua)?'windows':'linux';
const platform=(os==='windows'||os==='mac')&&firefox&&firefox<120||os==='linux'&&firefox?'firefox':os;
const content={
 windows:{download:'/pageway/ca.cmd',steps:zh?['运行已下载的 Pageway RDP 信任脚本，浏览器下载时请选择“保留”。','在 Windows 安全警告中核对指纹并点“是”，无需管理员权限。','完成后本页自动进入；Chrome、Edge、Firefox 120 及以上版本通用。']:['Run the downloaded Pageway RDP trust script. Choose Keep if the browser asks.','Verify the fingerprint in the Windows security warning and select Yes. Administrator rights are not required.','This page will connect automatically. Works in Chrome, Edge and Firefox 120 or later.'],waiting:zh?'运行刚下载的 Pageway RDP 信任脚本，在系统提示中核对指纹并点“是”。':'Run the downloaded Pageway RDP trust script, verify the fingerprint and select Yes in the system prompt.'},
 firefox:{download:'/pageway/ca.der',steps:zh?['打开 Firefox 设置 > 隐私与安全 > 证书 > 查看证书。','在“证书机构”中导入刚下载的 ca.der，并勾选“信任此 CA 标识网站”。','完成后本页自动进入。']:['Open Firefox Settings > Privacy & Security > Certificates > View Certificates.','Import the downloaded ca.der under Authorities and select Trust this CA to identify websites.','This page will connect automatically when complete.'],waiting:zh?'请在 Firefox 的证书机构设置中完成 ca.der 的导入和信任。':'Complete the ca.der import and trust steps in Firefox certificate authorities settings.'},
 linux:{download:'/pageway/ca.cer',steps:zh?['打开 chrome://certificate-manager。','在本地证书中导入刚下载的 ca.cer 并设为受信任的证书机构，完成后本页自动进入。']:['Open chrome://certificate-manager.','Import the downloaded ca.cer under local certificates and trust it as a certificate authority. This page will connect automatically.'],waiting:zh?'请在浏览器证书管理中完成 ca.cer 的导入和信任。':'Complete the ca.cer import and trust steps in your browser certificate manager.'},
 mac:{download:'/pageway/ca.mobileconfig',steps:zh?['打开已下载的描述文件。','在系统设置中安装并输入密码，适用于 Safari、Chrome、Edge 和 Firefox 120 及以上版本。','完成后本页自动进入；如仍提示不安全，在钥匙串访问中设为“始终信任”。']:['Open the downloaded profile.','Install it in System Settings and enter your password. Works in Safari, Chrome, Edge and Firefox 120 or later.','This page will connect automatically. If the browser still warns, set the certificate to Always Trust in Keychain Access.'],waiting:zh?'请在系统设置中完成描述文件安装。':'Complete the profile installation in System Settings.'},
 ios:{download:'/pageway/ca.mobileconfig',steps:zh?['在系统设置中安装已下载的描述文件。','打开“设置 > 通用 > 关于本机 > 证书信任设置”。','启用 Pageway RDP 根证书的完全信任，完成后本页自动进入。']:['Install the downloaded profile in Settings.','Open Settings > General > About > Certificate Trust Settings.','Enable full trust for the Pageway RDP root certificate. This page will connect automatically.'],waiting:zh?'请完成描述文件安装，并在证书信任设置中启用完全信任。':'Install the profile and enable full trust in Certificate Trust Settings.'},
 android:{download:'/pageway/ca.cer',steps:zh?['打开“设置 > 安全 > 加密与凭据 > 安装证书 > CA 证书”。','选择刚下载的 ca.cer，完成后本页自动进入。']:['Open Settings > Security > Encryption & credentials > Install a certificate > CA certificate.','Select the downloaded ca.cer. This page will connect automatically.'],waiting:zh?'请在系统设置中完成 CA 证书安装。':'Complete the CA certificate installation in Settings.'}
};
const selected=content[platform];
document.getElementById('host').textContent=location.hostname;
document.getElementById('address').textContent=location.host;
document.getElementById('waiting-steps').replaceChildren(...selected.steps.map(step=>{const li=document.createElement('li');li.textContent=step;return li}));
document.getElementById('waiting-text').textContent=selected.waiting;
fetch('/pageway/trust.json').then(r=>r.json()).then(info=>{document.getElementById('host').textContent=info.host;document.getElementById('fingerprint').textContent=info.fingerprint}).catch(()=>{});
async function poll(){if(!polling)return;if(await check()){polling=false;return}if(polling)pollTimer=setTimeout(poll,1500)}
document.getElementById('trust').onclick=()=>{const link=document.createElement('a');link.href=selected.download;link.download='';document.body.appendChild(link);link.click();link.remove();show('waiting');clearTimeout(pollTimer);polling=true;poll()};
document.getElementById('once').onclick=()=>{location.href=secureUrl.href};
for(const button of document.querySelectorAll('.back'))button.onclick=()=>{polling=false;clearTimeout(pollTimer);show('identity')};
check().then(ok=>{if(!ok)show('identity')});
</script>
</body>
</html>
